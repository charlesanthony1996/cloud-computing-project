name: CI - build and test pipeline

on:
  push:
    branches: [main]
  pull_request:


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build images
        uses: docker compose build
      
      - name: start services
        uses: docker compose up -d