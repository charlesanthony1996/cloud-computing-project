# .github/workflows/ci.yml

name: CI - build and test pipeline

on:
  push:
    branches: [main]
  pull_request:


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build images
        run: docker compose build
      
      - name: start services
        run: docker compose up -d

      - name: show that everything is running
        run: echo "success"

      - name: wait for services
        run: sleep 15

      - name: health check ingestion
        run: curl --fail http://localhost:8081/health

      - name: health check anomaly
        run: curl --fail http://localhost:8080/health

      - name: stop services
        run: docker compose down