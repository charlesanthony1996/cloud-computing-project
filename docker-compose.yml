version: "3.9"

services:
  ingestion:
    build: ./ingestion-service
    container_name: ingestion
    ports: ["8081:8081"]
    # environment:
    #     - FEATURE_URL=http://feature:8082/features
    # networks: [stack]

  anomaly:
    build: ./anomaly-service
    container_name: anomaly
    ports:
      - "8080:8080"
    volumes:
      - ./models/simple_lstm_model.pt:/app/simple_lstm_model.pt
      - ./models/light_lstm_model.pt:/app/light_lstm_model.pt

  feature:
    build: ./feature-service
    container_name: feature
    environment:
        - ANOMALY_URL=http://anomaly:8080/predict
    ports:
        - "8082:8080"

  generator:
    build: ./generator-service
    container_name: generator
    ports:
        - "8083:8083"

  carbon:
    build: ./carbon-controller-service
    container_name: carbon
    depends_on:
      - ingestion
      - generator
    ports:
      - "8084:8084"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - ingestion
      - generator
      - carbon

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
     - "3000:3000"
    depends_on:
      - prometheus



